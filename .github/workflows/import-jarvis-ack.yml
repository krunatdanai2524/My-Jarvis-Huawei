name: Save Jarvis acknowledgment MP3
on:
  push:
    paths: [.github/workflows/import-jarvis-ack.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  store-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Thai acknowledgment audio
        env:
          SOURCE_AUDIO: https://resource2.heygen.ai/text_to_speech/8f1bdae5d24f414ab7bb1c2e4df3455e/bba701d6054041ed881626391e02865c/id=431fe65310dd44499c2e34cc1af8ff30.mp3
        run: |
          mkdir -p assets
          curl --fail --location --show-error --silent --retry 2 --max-time 90 "$SOURCE_AUDIO" --output assets/jarvis-ack-th.mp3
          test "$(wc -c < assets/jarvis-ack-th.mp3)" -gt 1500
          file assets/jarvis-ack-th.mp3 | grep -Ei 'audio|mpeg|mp3'
      - name: Save MP3 to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jarvis-ack-th.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Add short Thai voice acknowledgment for Jarvis"
            git push
          fi
